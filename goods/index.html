<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--black:#0c0c0d; --black-2:#141416; --bone:#f4f2ed; --dim:rgba(244,242,237,.6); --line:rgba(244,242,237,.14);
    --line-2:rgba(244,242,237,.28); --red:#ff3d2e; --print-red:#c0281f;}
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--black); color:var(--bone); font-family:Pretendard,-apple-system,sans-serif}
  body{min-height:100vh}
  .app{display:grid; grid-template-columns:380px minmax(0,1fr); min-height:100vh}
  aside{border-right:1px solid var(--line); padding:24px 22px 60px; height:100vh; overflow-y:auto; position:sticky; top:0}
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:22px}
  .brand img{height:38px; filter:invert(1)}
  .brand b{font-family:"Bebas Neue"; font-weight:400; font-size:30px; letter-spacing:.04em; line-height:1}
  .brand small{display:block; font-size:11px; letter-spacing:.2em; color:var(--dim)}
  fieldset{border:none; border-top:1px solid var(--line); padding:16px 0 4px}
  legend{font-family:"Bebas Neue"; font-size:19px; letter-spacing:.12em; color:var(--bone); padding-right:8px}
  legend small{font-family:Pretendard; font-size:11px; color:var(--dim); letter-spacing:0; margin-left:6px}
  label{display:block; font-size:12px; color:var(--dim); margin:10px 0 5px}
  input,select,textarea{width:100%; background:var(--black-2); border:1px solid var(--line-2); color:var(--bone); border-radius:8px;
    padding:9px 10px; font:inherit; font-size:13.5px}
  textarea{min-height:64px; resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--red); outline-offset:1px}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .row3{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
  .seg{display:flex; flex-wrap:wrap; gap:6px}
  .seg button{background:none; border:1px solid var(--line-2); color:var(--dim); border-radius:999px; padding:6px 12px;
    font:600 12.5px Pretendard; cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--bone); color:var(--black); border-color:var(--bone)}
  .sw{display:flex; gap:8px; flex-wrap:wrap}
  .sw button{width:30px; height:30px; border-radius:50%; border:1px solid var(--line-2); cursor:pointer}
  .sw button[aria-pressed="true"]{outline:2px solid var(--red); outline-offset:2px}
  .hint{font-size:11.5px; color:var(--dim); margin-top:6px; line-height:1.5}
  main{min-width:0; padding:20px 28px 60px}
  .bar{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px}
  .tabs{display:flex; gap:6px}
  .tabs button{background:none; border:1px solid var(--line-2); color:var(--dim); border-radius:999px; padding:8px 16px;
    font:700 14px Pretendard; letter-spacing:.02em; cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--bone); color:var(--black); border-color:var(--bone)}
  .act{display:flex; gap:8px}
  .act button{background:var(--red); color:#fff; border:none; border-radius:999px; padding:10px 18px; font:700 13.5px Pretendard; cursor:pointer}
  .act button.ghost{background:none; border:1px solid var(--line-2); color:var(--bone)}
  .stage canvas{width:100%; height:auto; display:block; border-radius:10px; border:1px solid var(--line)}
  .stage .note{font-size:12px; color:var(--dim); margin-top:10px}
  [hidden]{display:none !important}
  .wo-wrap{background:#3a3a3c; padding:20px; border-radius:10px; overflow-x:auto}
  /* work order (A4) */
  .wo{color:#0c0c0d; font-size:9.5pt; line-height:1.45}
  .page{width:210mm; min-height:296.5mm; padding:13mm 14mm 16mm; background:#fff; margin:0 auto 16px; position:relative;
    display:flex; flex-direction:column}
  .wo .head{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #0c0c0d; padding-bottom:8pt}
  .wo h1{font-weight:900; font-size:24pt; line-height:1} .wo h1 span{font-family:"Bebas Neue"; font-weight:400; color:var(--print-red); margin-left:6pt; letter-spacing:.05em}
  .wo .docno{font-family:"JetBrains Mono"; font-size:8.5pt; text-align:right; line-height:1.7}
  .wo h2{font-family:"Bebas Neue"; font-weight:400; font-size:14pt; letter-spacing:.12em; margin:12pt 0 5pt; border-bottom:1px solid #0c0c0d; padding-bottom:2pt}
  .wo h2 small{font-family:Pretendard; font-size:8pt; color:#777; letter-spacing:0; margin-left:6pt}
  .wo dl{display:grid; grid-template-columns:20mm 1fr 20mm 1fr; gap:4pt 8pt} .wo dt{color:#777; font-size:8.5pt} .wo dd{font-weight:600}
  .wo table{width:100%; border-collapse:collapse} .wo th{font-size:8pt; color:#666; font-weight:600; text-align:left; padding:4pt; border-bottom:1.2px solid #0c0c0d; background:#f4f2ed}
  .wo td{padding:4pt; border-bottom:.6px solid #ccc; vertical-align:middle} .wo td.l{font-weight:600} .wo td.c,.wo th.c{text-align:center}
  .wo td.num{font-family:"JetBrains Mono"; font-size:8.5pt; text-align:center}
  .todo{display:inline-block; border:1px dashed var(--print-red); color:var(--print-red); font-size:7.5pt; font-weight:600; padding:0 4pt; border-radius:2pt}
  .wo .sketch{width:100%; display:block; border-radius:3mm}
  .wo .art{width:26mm; height:16mm; object-fit:contain; background:#0c0c0d; border-radius:1.5mm; padding:1.5mm; display:block}
  .pin{display:inline-block; width:14pt; height:14pt; border-radius:50%; background:var(--print-red); color:#fff; font:700 8pt/14pt Pretendard; text-align:center}
  .wo ul{padding-left:12pt} .wo li{margin-bottom:2pt}
  .wo .two{display:grid; grid-template-columns:1fr 1fr; gap:6mm}
  .wo .sign{display:grid; grid-template-columns:repeat(3,1fr); gap:4mm; margin-top:auto} .wo .sign div{border:1px solid #0c0c0d; height:22mm; padding:3pt 5pt; font-size:8pt; color:#666}
  .wo .foot{position:absolute; bottom:6mm; left:14mm; right:14mm; display:flex; justify-content:space-between; font-size:7pt; color:#999; font-family:"JetBrains Mono"}
  .tabs button,.act button{white-space:nowrap}
  @media (max-width:900px){ .tabs button{padding:7px 12px; font-size:13px} .act button{padding:9px 14px; font-size:12.5px} .app{grid-template-columns:minmax(0,1fr)} aside{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line)} main{padding:16px} }
  @media print{
    @page{size:A4; margin:0}
    html,body{background:#fff}
    aside,.bar,.stage:not(#tabWo),.stage .note{display:none !important}
    .app{display:block} main{padding:0} #tabWo{display:block !important}
    .wo-wrap{background:none; padding:0; border-radius:0}
    .page{margin:0; page-break-after:always; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><img src="assets/symbol.png" alt=""><div><b>GOODS STUDIO</b><small>S2:U · 시안 · 작업지시서</small></div></div>

  <fieldset><legend>ITEM<small>아이템 · 컬러</small></legend>
    <label>아이템</label>
    <div class="seg" id="item"><button type="button" data-v="hoodie" aria-pressed="true">후디</button><button type="button" data-v="tee" aria-pressed="false">티셔츠</button></div>
    <label>바디 컬러</label><div class="sw" id="body"></div>
    <label>프린트(잉크) 컬러</label><div class="sw" id="ink"></div>
    <div class="row"><div><label>제품명</label><input id="name" value="S2:U SYMBOL HOODIE"></div><div><label>품번</label><input id="code" value="S2U-HD-01"></div></div>
    <div class="row"><div><label>시즌</label><input id="season" value="2026 FW"></div><div><label>시안 제목 (두 줄은 / 로)</label><input id="title" value="SYMBOL / HOODIE"></div></div>
  </fieldset>

  <fieldset><legend>A · FRONT<small>앞판 그래픽</small></legend>
    <div class="seg" id="aArt"></div>
    <div id="aTextWrap" hidden><label>문구 (줄바꿈 가능)</label><textarea id="aText">S2:U</textarea></div>
    <div id="aUpWrap" hidden><label>이미지 올리기 (PNG 권장, 배경 투명)</label><input type="file" id="aUp" accept="image/*"></div>
    <label>위치</label>
    <div class="seg" id="aPos"><button type="button" data-v="left" aria-pressed="true">가슴 왼쪽</button><button type="button" data-v="center" aria-pressed="false">가슴 중앙</button></div>
    <div class="row"><div><label>가로 (mm)</label><input id="aW" type="number" min="10" max="400" value="45"></div><div><label>가공</label><select id="aMethod"><option>실크스크린 1도</option><option>자수</option><option>DTF 전사</option><option>고주파 / 실리콘</option></select></div></div>
  </fieldset>

  <fieldset><legend>B · BACK<small>뒷판 그래픽</small></legend>
    <div class="seg" id="bArt"></div>
    <div id="bTextWrap" hidden><label>문구 (줄바꿈 가능)</label><textarea id="bText">SUSTAIN
TO YOU</textarea></div>
    <div id="bUpWrap" hidden><label>이미지 올리기 (PNG 권장, 배경 투명)</label><input type="file" id="bUp" accept="image/*"></div>
    <div class="row"><div><label>가로 (mm)</label><input id="bW" type="number" min="10" max="400" value="280"></div><div><label>가공</label><select id="bMethod"><option>실크스크린 1도</option><option>자수</option><option>DTF 전사</option><option>고주파 / 실리콘</option></select></div></div>
  </fieldset>

  <fieldset><legend>WORK ORDER<small>작업지시서 · 비우면 "확인 필요"</small></legend>
    <label>원단</label><input id="fabric" placeholder="예: 면 100% 기모 쭈리 (중량은 공장 확인)">
    <div class="row"><div><label>거래처(공장)</label><input id="vendor"></div><div><label>담당</label><input id="owner"></div></div>
    <label>사이즈별 수량</label><div class="row3" id="qty"></div>
    <label>사이즈 스펙 (cm, 제안값 — 공장 샘플로 확정)</label><div id="spec"></div>
    <div class="row"><div><label>넥 라벨</label><input id="tNeck"></div><div><label>케어 라벨</label><input id="tCare"></div></div>
    <div class="row"><div><label>행택</label><input id="tTag" value="제안: S2:U 심볼 행택"></div><div><label>포장</label><input id="tPack" value="제안: 개별 폴리백 + 사이즈 스티커"></div></div>
    <div class="row"><div><label>샘플 요청일</label><input id="dReq" type="date"></div><div><label>샘플 확정일</label><input id="dOk" type="date"></div></div>
    <div class="row"><div><label>생산 납기</label><input id="dDue" type="date"></div><div><label>입고처</label><input id="dest"></div></div>
    <label>유의사항</label><textarea id="notes">원단 위 스트라이크오프(시험 인쇄) 사진 확인 후 본생산.
아트워크 원본(AI/PDF 벡터)은 별도 전달. 문서 이미지는 위치·비율 참고용.
위치 기준 HPS = 옆목점. 사이즈 스펙은 세탁 전 완성 치수.</textarea>
    <p class="hint">입력한 내용은 이 브라우저에만 저장돼요.</p>
  </fieldset>
</aside>

<main>
  <div class="bar">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-t="tabMock" aria-selected="true">시안</button>
      <button type="button" role="tab" data-t="tabShot" aria-selected="false">스튜디오 뷰</button>
      <button type="button" role="tab" data-t="tabWo" aria-selected="false">작업지시서</button>
    </div>
    <div class="act"><button type="button" class="ghost" id="dlPng">PNG 저장</button><button type="button" id="printWo">작업지시서 PDF</button></div>
  </div>
  <section class="stage" id="tabMock"><canvas id="cvMock" width="1600" height="1100"></canvas></section>
  <section class="stage" id="tabShot" hidden><canvas id="cvShot" width="1600" height="1500"></canvas>
    <p class="note" id="shotNote">AI로 만든 무지 후디 사진 위에 지금 설정한 그래픽을 합성한 참고용 이미지예요. 원단 질감·핏은 실물 샘플로 확인하세요.</p></section>
  <section class="stage" id="tabWo" hidden><div class="wo-wrap"><div class="wo" id="wo"></div></div>
    <p class="note">"작업지시서 PDF" → 인쇄 창에서 "PDF로 저장"을 고르세요. (A4 · 여백 없음)</p></section>
</main>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const BODY = [{n:'Black', h:'#0C0C0D'}, {n:'Off White', h:'#EEEAE2'}, {n:'Heather Gray', h:'#9C9C9E'}, {n:'Navy', h:'#1C2433'}, {n:'Olive', h:'#4A4D3A'}];
  const INK = [{n:'Bone', h:'#F4F2ED'}, {n:'Black', h:'#0C0C0D'}, {n:'S2:U Red', h:'#FF3D2E'}, {n:'Recovery Blue', h:'#2B6CB0'}];
  const ARTS_A = [['symbol','심볼'],['wordmark','워드마크'],['text','문구'],['upload','이미지'],['none','없음']];
  const ARTS_B = [['programs','프로그램 S2:1–4'],['symbol','심볼'],['wordmark','워드마크'],['text','문구'],['upload','이미지'],['none','없음']];
  const SIZES = ['S','M','L','XL'];
  const SPEC = {
    hoodie: [['총장 (HPS–밑단)',[66,69,72,75]],['가슴 단면',[56,59,62,65]],['어깨 너비',[50,52,54,56]],['소매 길이',[58,59,60,61]],['밑단 단면 (시보리)',[48,51,54,57]],['후드 높이',[35,36,37,38]]],
    tee: [['총장 (HPS–밑단)',[68,71,74,77]],['가슴 단면',[53,56,59,62]],['어깨 너비',[47,49,51,53]],['소매 길이',[21,22,23,24]],['밑단 단면',[53,56,59,62]],['넥 너비',[18,18.5,19,19.5]]]
  };
  const st = {item:'hoodie', body:'#0C0C0D', ink:'#F4F2ED', aArt:'symbol', bArt:'programs', aPos:'left', aImg:null, bImg:null, spec:null};

  // ---- flat sketches (viewBox 400×460) ----
  const SK = {
    hoodie:{
      front:[['M112 92 L64 120 L30 372 L76 384 L112 200 Z','b'],['M288 92 L336 120 L370 372 L324 384 L288 200 Z','b'],['M30 372 L76 384 L73 402 L27 390 Z','b'],['M370 372 L324 384 L327 402 L373 390 Z','b'],
        ['M112 92 Q200 70 288 92 L298 206 L300 410 Q200 420 100 410 L102 206 Z','b'],['M100 410 Q200 420 300 410 L300 436 Q200 446 100 436 Z','b'],
        ['M142 84 Q150 26 200 22 Q250 26 258 84 Q236 128 200 132 Q164 128 142 84 Z','b'],['M160 86 Q168 46 200 44 Q232 46 240 86 Q224 116 200 118 Q176 116 160 86 Z','s'],
        ['M186 118 L182 176 M214 118 L218 176','l'],['M140 300 L260 300 L282 384 L118 384 Z','d']],
      back:[['M112 92 L64 120 L30 372 L76 384 L112 200 Z','b'],['M288 92 L336 120 L370 372 L324 384 L288 200 Z','b'],['M30 372 L76 384 L73 402 L27 390 Z','b'],['M370 372 L324 384 L327 402 L373 390 Z','b'],
        ['M112 92 Q200 70 288 92 L298 206 L300 410 Q200 420 100 410 L102 206 Z','b'],['M100 410 Q200 420 300 410 L300 436 Q200 446 100 436 Z','b'],
        ['M138 92 Q144 30 200 24 Q256 30 262 92 Q232 104 200 104 Q168 104 138 92 Z','b'],['M200 26 L200 102','l']],
      a:{y:142}, b:{y:112}},
    tee:{
      front:[['M120 70 L52 104 L26 186 L84 204 L104 156 Z','b'],['M280 70 L348 104 L374 186 L316 204 L296 156 Z','b'],
        ['M120 70 Q160 60 168 62 Q200 96 232 62 Q240 60 280 70 L296 156 L300 430 Q200 440 100 430 L104 156 Z','b'],['M168 62 Q200 96 232 62 Q226 84 200 92 Q174 84 168 62 Z','s']],
      back:[['M120 70 L52 104 L26 186 L84 204 L104 156 Z','b'],['M280 70 L348 104 L374 186 L316 204 L296 156 Z','b'],
        ['M120 70 Q160 60 168 62 Q200 70 232 62 Q240 60 280 70 L296 156 L300 430 Q200 440 100 430 L104 156 Z','b']],
      a:{y:120}, b:{y:100}}
  };
  const UNIT_PER_MM = 200 / 590;   // body width ≈ 200 units ≈ 59cm chest

  // ---- assets ----
  const IMG = {};
  function load(src){ return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }
  const tintCache = {};
  function tinted(key, color){
    const k = key + color; if(tintCache[k]) return tintCache[k];
    const im = IMG[key]; if(!im) return null;
    const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
    return tintCache[k] = c;
  }
  function luminance(h){ const n = parseInt(h.slice(1), 16); return (0.299*(n>>16 & 255) + 0.587*(n>>8 & 255) + 0.114*(n & 255)) / 255; }

  // ---- artwork: draws at (cx, top) with width w (px); returns height ----
  function artAspect(kind, which){
    if(kind === 'symbol') return 768/428;
    if(kind === 'wordmark') return 770/1098;
    if(kind === 'programs') return 210/280;
    if(kind === 'upload'){ const im = st[which + 'Img']; return im ? im.naturalHeight / im.naturalWidth : 0.6; }
    if(kind === 'text'){ const lines = ($(which + 'Text').value || ' ').split('\n'); return Math.max(.25, lines.length * 0.42 / Math.max(...lines.map(l => Math.max(l.length, 3) * 0.42))); }
    return 0;
  }
  function drawArt(ctx, kind, which, cx, top, w, ink){
    const h = w * artAspect(kind, which), x = cx - w/2;
    if(kind === 'symbol' || kind === 'wordmark'){ const t = tinted(kind, ink); if(t) ctx.drawImage(t, x, top, w, h); }
    else if(kind === 'upload'){ const im = st[which + 'Img']; if(im) ctx.drawImage(im, x, top, w, h); }
    else if(kind === 'programs'){
      const s = w / 280; ctx.save(); ctx.translate(x, top); ctx.scale(s, s); ctx.fillStyle = ink;
      fitText(ctx, 'SUSTAIN TO YOU', 0, 48, 280, 56); ctx.fillRect(0, 62, 280, 2);
      [['S2:1','GROUND MOVEMENT'],['S2:2','STRENGTH CAPACITY'],['S2:3','HYBRID ENGINE'],['S2:4','RECOVERY & LIFESTYLE']].forEach((r, i) => {
        ctx.font = '28px "Bebas Neue"'; ctx.fillText(r[0], 0, 100 + i*36); fitText(ctx, r[1], 64, 100 + i*36, 216, 28, true);
      });
      ctx.restore();
    } else if(kind === 'text'){
      const lines = ($(which + 'Text').value || '').split('\n'); const lh = h / lines.length;
      ctx.save(); ctx.fillStyle = ink; lines.forEach((l, i) => fitText(ctx, l, x, top + lh*(i+1) - lh*0.12, w, lh*0.95, false, true)); ctx.restore();
    }
    return h;
  }
  function fitText(ctx, txt, x, y, maxW, size, shrinkOnly, center){
    ctx.font = size + 'px "Bebas Neue"'; let tw = ctx.measureText(txt).width;
    if(!shrinkOnly || tw > maxW){ ctx.save(); const sx = tw > 0 ? maxW / tw : 1; const k = shrinkOnly ? Math.min(1, sx) : sx;
      ctx.translate(x, y); ctx.scale(k, 1); ctx.fillText(txt, 0, 0); ctx.restore(); }
    else ctx.fillText(txt, center ? x + (maxW - tw)/2 : x, y);
  }

  // ---- garment ----
  function drawGarment(ctx, view, ox, oy, scale, opts){
    const sk = SK[st.item], dark = luminance(st.body) < 0.5;
    const line = opts.line || (dark ? 'rgba(244,242,237,.22)' : 'rgba(12,12,13,.35)');
    const shade = dark ? '#000' : 'rgba(0,0,0,.12)';
    ctx.save(); ctx.translate(ox, oy); ctx.scale(scale, scale); ctx.lineJoin = 'round';
    if(opts.shadow){ ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 18; }
    sk[view].forEach(([d, kind]) => {
      const p = new Path2D(d); ctx.lineWidth = kind === 'b' ? 2 : 1.5; ctx.strokeStyle = line; ctx.setLineDash(kind === 'd' ? [4,3] : []);
      if(kind === 'b'){ ctx.fillStyle = st.body; ctx.fill(p); ctx.shadowColor = 'transparent'; }

    ...SHOTS.map(s => load(`assets/${s.k}.jpg`).then(i => IMG[s.k] = i)),
    document.fonts.load('96px "Bebas Neue"'), document.fonts.load('15px Pretendard'), document.fonts.load('12px "JetBrains Mono"')
  ]).then(() => document.fonts.ready).then(() => {
    const h = {'#studio':'tabShot', '#wo':'tabWo'}[location.hash];
    renderWO();
    if(h) document.querySelector(`.tabs button[data-t="${h}"]`).click(); else render();
  });
})();
</script>
</body>
</html>
